[project]
name = "coi-cf-api"
version = "0.1.0"
description = "Cyfryzacja formularzy – konwersja blankietów do JSON Generatora Formularzy COI"
requires-python = ">=3.14"
# Wersje do przypięcia (najnowsze stabilne) przy pierwszym `uv lock`.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "python-multipart",
    "pyjwt",
    "argon2-cffi",
    "python-magic",
    "pdfplumber",
    "pypdfium2",
    "python-docx",
    "openpyxl",
    "pillow",
    "pytesseract",
    "defusedxml",
    "httpx",
    "jsonschema",
    "jsonata-python",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "pip-licenses"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

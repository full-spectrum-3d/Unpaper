[project]
name = "coi-cf-api"
version = "0.1.0"
description = "Cyfryzacja formularzy – konwersja blankietów do JSON Generatora Formularzy COI"
requires-python = ">=3.14"
# Wersje do przypięcia (najnowsze stabilne) przy pierwszym `uv lock`.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "python-multipart",
    "argon2-cffi",
    "python-magic",
    "pdfplumber",
    "pypdfium2",
    "python-docx",
    "openpyxl",
    "pillow",
    "pytesseract",
    "defusedxml",
    "httpx",
    "jsonschema",
    "jsonata-python",
    "pyjwt[crypto]>=2.15.1",
    "olefile>=0.47",
    "msoffcrypto-tool>=6.1.0",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "pip-licenses"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Biblioteki bez typów (brak py.typed i stubów).
module = [
    "olefile",
    "jsonschema",
    "defusedxml",
    "defusedxml.*",
    "pypdfium2",
    "pypdfium2.*",
    "msoffcrypto",
    "msoffcrypto.*",
    "jsonata",
    "jsonata.*",
    "lxml",
    "lxml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

markers = [
    "llm: wymaga działającej Ollamy",
    "converter: wymaga LibreOffice (soffice)",
]
addopts = "-m 'not llm and not converter'"
# Domyślne norecursedirs pomija katalogi `build` (tests/unit/build).
norecursedirs = [".*", "dist", "CVS", "_darcs", "{arch}", "*.egg", "venv", "node_modules"]


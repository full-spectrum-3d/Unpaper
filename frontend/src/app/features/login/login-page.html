<main class="w-full max-w-sm">
  <app-card>
    <h1 cardTitle tabindex="-1">Cyfryzacja formularzy</h1>
    <form class="flex flex-col gap-[12px] p-[16px]" novalidate (submit)="submit($event)">
      <!-- Always in the DOM and filled after render: a live region inserted with its text is often not read. -->
      <p role="status" class="text-fg-muted" [class.sr-only]="!statusText()">{{ statusText() }}</p>
      @if (status() === 'error' && error(); as text) {
        <p #loginError role="alert" tabindex="-1" class="text-danger">
          <span aria-hidden="true">✕</span> {{ text }}
        </p>
      }
      <app-text-field
        label="Login"
        autocomplete="username"
        [formField]="f.username"
        [error]="message(f.username)"
      />
      <app-text-field
        label="Hasło"
        type="password"
        autocomplete="current-password"
        [formField]="f.password"
        [error]="message(f.password)"
      />
      <button appButton type="submit" variant="primary" [disabled]="status() === 'pending'">
        {{ status() === 'pending' ? 'Logowanie…' : 'Zaloguj' }}
      </button>
    </form>
  </app-card>
</main>

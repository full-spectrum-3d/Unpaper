<app-card class="w-full max-w-sm">
  <h1 cardTitle>Cyfryzacja formularzy</h1>
  <form class="flex flex-col gap-[12px] p-[16px]" novalidate (submit)="submit($event)">
    @if (sessionExpired()) {
      <p role="status" class="text-fg-muted">Sesja wygasła, zaloguj się ponownie</p>
    }
    @if (status() === 'error' && error(); as text) {
      <p role="alert" class="text-danger"><span aria-hidden="true">✕</span> {{ text }}</p>
    }
    <app-text-field
      label="Login"
      autocomplete="username"
      [formField]="f.username"
      [error]="message(f.username)"
    />
    <app-text-field
      label="Hasło"
      type="password"
      autocomplete="current-password"
      [formField]="f.password"
      [error]="message(f.password)"
    />
    <button appButton type="submit" variant="primary" [disabled]="status() === 'pending'">
      {{ status() === 'pending' ? 'Logowanie…' : 'Zaloguj' }}
    </button>
  </form>
</app-card>

<main class="flex flex-col gap-section">
  <div class="flex flex-col gap-section w-full max-w-[960px] mx-auto">
    <a routerLink="/import" class="self-start text-primary focus-ring rounded-field">← Wróć do importu</a>
    @if (item(); as i) {
      <app-card>
        <h1 cardTitle class="[overflow-wrap:anywhere]">{{ i.name }}</h1>
        <span cardActions class="flex flex-wrap items-center gap-2">
          <span role="tablist" aria-label="Widok wyniku" class="flex gap-2">
            @for (t of tabs(); track t) {
              <button
                appButton
                type="button"
                role="tab"
                [id]="'result-tab-' + t"
                [attr.aria-controls]="'result-panel-' + t"
                [attr.aria-selected]="activeTab() === t"
                [attr.tabindex]="activeTab() === t ? 0 : -1"
                [variant]="activeTab() === t ? 'primary' : 'secondary'"
                (click)="selectTab(t)"
                (keydown)="onTabKeydown($event)"
              >
                {{ tabLabels[t] }}
              </button>
            }
          </span>
          <button appButton type="button" variant="secondary" (click)="download()">Pobierz .json</button>
          <a
            routerLink="/validator"
            [queryParams]="{ item: i.id }"
            class="border rounded-field px-[12px] py-field-y font-semibold text-body focus-ring bg-surface text-primary border-primary hover:bg-primary-subtle"
          >
            Sprawdź w walidatorze
          </a>
        </span>
        @if (!form()) {
          <p class="text-fg-muted">Nie można wyświetlić podglądu: wynik nie ma struktury formularza.</p>
        }
        <div id="result-panel-json" role="tabpanel" aria-labelledby="result-tab-json" [hidden]="activeTab() !== 'json'">
          <app-json-view [lines]="json()" [highlight]="highlightPath()" label="Wynik konwersji w formacie JSON" />
        </div>
        <div id="result-panel-report" role="tabpanel" aria-labelledby="result-tab-report" [hidden]="activeTab() !== 'report'">
          <app-report-view [report]="report()" [ranges]="json().ranges" (showInJson)="onShowInJson($event)" />
        </div>
      </app-card>
    } @else {
      <h1 class="text-title font-semibold">Wynik</h1>
      <p class="text-fg-muted">Wynik niedostępny. Wróć do importu i przetwórz plik ponownie.</p>
    }
  </div>
  @if (form(); as f) {
    <!-- Stays mounted on other tabs so answers and the current step survive switching. -->
    <div
      id="result-panel-preview"
      role="tabpanel"
      aria-labelledby="result-tab-preview"
      data-theme="preview"
      class="bg-bg p-section"
      [hidden]="activeTab() !== 'preview'"
    >
      <app-form-renderer [definition]="f" />
    </div>
  }
</main>

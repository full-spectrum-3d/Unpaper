# Spec §10.4, §11.1: nasłuch 8080, nie-root, pid i cache w /tmp, proxy /api.
pid /tmp/nginx.pid;
events {}
http {
  include       /etc/nginx/mime.types;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # MAX_FILE_SIZE_MB (20) + zapas na nagłówki multipart. Właściwy limit sprawdza API.
  client_max_body_size 21m;
  server_tokens off;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # > REQUEST_TIMEOUT_S (540): konwersja na CPU trwa kilka minut, odpowiedź 504 wysyła API.
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

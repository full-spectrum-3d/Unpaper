# Spec §10.4, §11.1: nasłuch 8080, nie-root, pid i cache w /tmp, proxy /api.
pid /tmp/nginx.pid;
events {}
http {
  include       /etc/nginx/mime.types;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # MAX_FILE_SIZE_MB (20) + zapas na nagłówki multipart. Właściwy limit sprawdza API.
  client_max_body_size 21m;
  server_tokens off;

  # Logowanie: argon2 to ~64 MiB i pełny rdzeń na próbę - limit chroni przed brute force
  # i głodzeniem puli wątków API. 10/min na IP, do 5 prób naraz bez czekania.
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_status 429;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # > REQUEST_TIMEOUT_S (540): konwersja na CPU trwa kilka minut, odpowiedź 504 wysyła API.
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }

    location = /api/v1/auth/token {
      limit_req zone=login burst=5 nodelay;
      error_page 429 = @login_throttled;
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # problem+json jak z API: frontend pokaże `detail` zamiast ogólnego błędu.
    location @login_throttled {
      default_type application/problem+json;
      add_header Retry-After 60 always;
      return 429 '{"type":"https://coi-cf/errors/TOO_MANY_REQUESTS","title":"Too Many Requests","status":429,"code":"TOO_MANY_REQUESTS","detail":"Zbyt wiele prób logowania. Spróbuj ponownie za minutę."}';
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ta sama wersja co w backend/Dockerfile.
  UV_VERSION: "0.13.9"

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # libmagic: wykrywanie typu pliku (python-magic). Testy z LibreOffice, Tesseractem
      # i modelem są wyłączone markerami w addopts (pyproject.toml).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1
      - run: pipx install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # uv: api:check eksportuje OpenAPI z backendu.
      - run: pipx install "uv==${UV_VERSION}"
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx ng test --watch=false
      - run: npx ng build
      # Regeneruje docs/openapi.json i klienta; kończy się błędem, gdy różnią się od commita.
      - run: npm run api:check

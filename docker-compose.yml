# Spec §4.1, §11. Uruchomienie: README.md (make setup, make up).
#
# Sieci:
#   public   - porty na hoście: api :8000, frontend :8080
#   internal - api ↔ llm, bez wyjścia do internetu (internal: true); llm nie ma portu na hoście
#   egress   - tylko jednorazowe pobranie modelu (profil `setup`, make model)
#
# api zostaje w `public` mimo braku potrzeby wyjścia do internetu w trybie lokalnym: port
# 127.0.0.1:8000 publikuje się tylko z sieci nie-internal, a tryb z zewnętrznym serwerem
# modelu (LLM_BASE_URL na host.docker.internal albo URL w internecie) wymaga wyjścia.
#
# Limity pamięci (spec §13.2: api ≤ 1 GB, llm ≤ 8 GB to cele): zapas na tmpfs api (512m,
# liczony do limitu kontenera) i MAX_CONCURRENT_JOBS=2 konwersje LibreOffice/Tesseract naraz.
# Większy model lokalny albo więcej zadań: API_MEM_LIMIT / LLM_MEM_LIMIT w .env.
#
# Lokalny model (usługi llm i llm-pull) jest opcjonalny: profil `ollama`, włączany zmienną
# COMPOSE_PROFILES=ollama w .env (domyślnie w .env.example). Bez niego API korzysta
# z zewnętrznego serwera modelu pod LLM_BASE_URL.
#
# Sekrety (JWT_SECRET, API_PASSWORD_HASH, klucze RS256) trafiają do kontenera dopiero
# w runtime: z pliku .env (env_file) albo z Docker secrets w /run/secrets. Obrazy ich nie zawierają.

x-hardening: &hardening
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  api:
    <<: *hardening
    build: ./backend
    image: coi-cf-api:0.1.0
    env_file: .env
    environment:
      # Baza zarejestrowanych kont: jedyny trwały zapis API, na osobnym wolumenie.
      USERS_DB_PATH: /data/users.db
    tmpfs: ["/tmp:size=512m,mode=1777"]
    volumes: ["api-data:/data"]
    # tini jako PID 1: zbiera procesy potomne LibreOffice po timeoucie konwersji.
    init: true
    pids_limit: 512
    mem_limit: ${API_MEM_LIMIT:-2g}
    depends_on:
      # required: false - bez profilu `ollama` usługi llm nie ma, a API startuje samo.
      llm: { condition: service_healthy, required: false }
    networks: [internal, public]
    # Zewnętrzny serwer modelu na tym samym hoście: LLM_BASE_URL=http://host.docker.internal:<port>.
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Tylko localhost: z zewnątrz API jest dostępne wyłącznie przez nginx (frontend),
    # który dokłada limity, CSP i rate limit logowania.
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    <<: *hardening
    build: ./frontend
    image: coi-cf-frontend:0.1.0
    tmpfs: ["/tmp"]
    pids_limit: 128
    mem_limit: 128m
    depends_on:
      # nginx rozwiązuje nazwę `api` dynamicznie (resolver w nginx.conf), healthy tylko
      # porządkuje pierwszy start.
      api: { condition: service_healthy }
    networks: [public]
    ports: ["${FRONTEND_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  llm:
    <<: *hardening
    build: ./llm
    image: coi-cf-llm:0.40.16
    profiles: ["ollama"]
    # qwen3:8b Q4 ~5 GB + kontekst; większy LLM_MODEL wymaga podniesienia LLM_MEM_LIMIT.
    mem_limit: ${LLM_MEM_LIMIT:-10g}
    environment:
      # Jeden model w RAM: domyślnie Ollama trzyma do 3, a dwa modele naraz (np. po zmianie
      # LLM_MODEL albo przy porównaniu w llm_eval) nie mieszczą się w 16 GB razem z API.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # Model zostaje w pamięci między żądaniami (pierwsze ładowanie trwa kilkadziesiąt sekund).
      OLLAMA_KEEP_ALIVE: "24h"
      # Bez funkcji chmurowych Ollamy (modele ollama.com, podpowiedzi modeli): żadnych
      # prób połączeń z internetem w trakcie działania.
      OLLAMA_NO_CLOUD: "1"
    tmpfs: ["/tmp"]
    volumes: ["ollama-models:/home/ollama/.ollama"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Jednorazowo: make model (docker compose --profile setup run --rm llm-pull). Osobny
  # profil `setup`, żeby `up` z profilem `ollama` nie pobierał modelu przy każdym starcie.
  llm-pull:
    <<: *hardening
    build: ./llm
    image: coi-cf-llm:0.40.16
    profiles: ["setup"]
    restart: "no"
    mem_limit: 1g
    entrypoint: ["pull-model"]
    environment:
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      OLLAMA_HOST: 127.0.0.1:11434
    tmpfs: ["/tmp"]
    volumes: ["ollama-models:/home/ollama/.ollama"]
    networks: [egress]

networks:
  internal: { internal: true }
  public: {}
  egress: {}

volumes:
  api-data:
  ollama-models:
    name: ollama-models

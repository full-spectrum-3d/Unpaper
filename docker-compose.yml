# Zarys wg specyfikacji §11.2. Wersje obrazów do przypięcia przed wydaniem.
services:
  api:
    build: ./backend
    env_file: .env
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      llm: { condition: service_healthy }
    networks: [internal, public]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/v1/health/live"]

  frontend:
    build: ./frontend
    read_only: true
    tmpfs: ["/tmp"]
    ports: ["8080:8080"]
    networks: [public]
    depends_on: [api]

  llm:
    image: ollama/ollama:0.40.16  # przed wydaniem: dodać digest @sha256
    environment:
      # Jeden model w RAM: domyślnie Ollama trzyma do 3, a dwa modele naraz (np. po zmianie
      # LLM_MODEL albo przy porównaniu w llm_eval) nie mieszczą się w 16 GB razem z API.
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes: ["ollama-models:/root/.ollama"]
    networks: [internal]          # bez portu na hoście
    healthcheck:
      test: ["CMD", "ollama", "list"]

networks:
  internal: { internal: true }
  public: {}

volumes:
  ollama-models: {}
